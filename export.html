<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Brief</title>
<link rel="icon" href="data:,">
<style>
:root{--text:#2c2c2b;--muted:#73726e;--border:#e3e2df;--soft:#f7f7f5;--blue:#2383e2;--green:#2e7d55;--amber:#a36a00;--red:#d44c47}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--soft);color:var(--text);font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.toolbar{position:sticky;top:0;z-index:1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border)}
.toolbar .status{flex:1 1 200px;color:var(--muted);font-size:14px;margin:0}
.status.ok{color:var(--green)}.status.err{color:var(--red)}
button{font:inherit;font-weight:600;border:1px solid var(--border);border-radius:7px;min-height:44px;padding:0 16px;cursor:pointer;background:#fff;color:var(--text)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sheet{max-width:794px;margin:24px auto;background:#fff;border:1px solid var(--border);border-radius:8px;padding:40px 48px}
.kicker{margin:0 0 4px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0 0 10px;font-size:20px;line-height:1.35;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 24px;padding-bottom:16px;border-bottom:2px solid var(--text);color:var(--muted);font-size:13.5px}
.meta strong{color:var(--text)}
.meta a{color:var(--blue)}
.field{margin:0 0 18px}
.field h2{break-after:avoid}
.field p{orphans:3;widows:3}
.field h2{margin:0 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.field p.empty{color:var(--muted)}
.note{color:var(--amber);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}
[hidden]{display:none!important}
@media (max-width:640px){.sheet{margin:0;border:0;border-radius:0;padding:24px 16px}.toolbar button{flex:1 1 auto}}
@page{size:A4;margin:16mm 16mm 18mm}
@media print{body{background:#fff}.toolbar{display:none}.sheet{margin:0;padding:0;border:0;max-width:none}.meta a{color:var(--text);text-decoration:none}}
</style>
</head>
<body>
<div class="toolbar">
  <p id="status" class="status" role="status" aria-live="polite">Preparazione del brief…</p>
  <button id="print" type="button" class="primary">Salva come PDF</button>
  <button id="copy" type="button">Copia testo</button>
  <button id="txt" type="button">Scarica .txt</button>
</div>
<main id="sheet" class="sheet" hidden>
  <p id="kicker" class="kicker">Brief</p>
  <h1 id="title"></h1>
  <div id="meta" class="meta"></div>
  <div id="fields"></div>
</main>
<script src="export.js"></script>
</body>
</html>
